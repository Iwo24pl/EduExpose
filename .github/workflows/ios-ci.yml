name: iOS CI

on:
  push:
    branches: [swift]
  pull_request:
    branches: [swift]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SCHEME: EduExpose
  PROJECT: EduExpose.xcodeproj

jobs:
  build-test-package:
    name: Build, test, package
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(python3 .github/scripts/pick_simulator.py)
          echo "Using simulator $UDID"
          set +e
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -destination-timeout 120 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Summarize tests
        if: always()
        shell: bash
        run: |
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult \
            --format json > test-summary.json 2>/dev/null || echo '{}' > test-summary.json
          cat test-summary.json

      - name: Smoke launch in simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(python3 .github/scripts/pick_simulator.py)
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*/Build/Products/Debug-iphonesimulator/EduExpose.app" \
            -print -quit)
          if [ -z "$APP" ]; then
            echo "EduExpose.app was not built"
            exit 1
          fi
          echo "Installing $APP"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl terminate "$UDID" com.iwo24pl.eduexpose || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.iwo24pl.eduexpose
          sleep 8
          if xcrun simctl spawn "$UDID" launchctl list | grep -q com.iwo24pl.eduexpose; then
            echo "Smoke test passed: the app is still running after launch."
          else
            echo "Smoke test failed: the app exited after launch."
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            test-summary.json
          if-no-files-found: ignore

      - name: Publish failing build log
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/swift'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI logs
          prerelease: true
          make_latest: false
          body: |
            Log z nieudanego builda ${{ github.sha }}.
            Pobierz `build.log` i `test-summary.json`, aby zobaczyć błędy.
          files: |
            build.log
            test-summary.json

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EduExpose.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee -a build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/EduExpose.xcarchive/Products/Applications/EduExpose.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry EduExpose-unsigned.ipa Payload
          shasum -a 256 EduExpose-unsigned.ipa > EduExpose-unsigned.ipa.sha256
          cp EduExpose-unsigned.ipa EduExpose-unsigned.ipa.sha256 "$GITHUB_WORKSPACE/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EduExpose-unsigned-ipa
          path: |
            EduExpose-unsigned.ipa
            EduExpose-unsigned.ipa.sha256

      - name: Publish rolling prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/swift'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: EduExpose (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body: |
            Automatyczny build gałęzi `swift` z commita ${{ github.sha }}.
            IPA jest niepodpisane — podpisz je Sideloadly przed instalacją.
            Instrukcja: docs/sideloading.md
          files: |
            EduExpose-unsigned.ipa
            EduExpose-unsigned.ipa.sha256
            test-summary.json
            build.log
