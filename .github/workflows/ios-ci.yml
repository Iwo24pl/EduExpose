name: iOS CI

on:
  push:
    branches: [swift]
  pull_request:
    branches: [swift]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-package:
    name: Build, test, package
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      SCHEME: EduExpose
      PROJECT: EduExpose.xcodeproj
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build and test
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for v in d.values() for x in v if 'iPhone' in x['name'] and x.get('isAvailable')))")
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EduExpose.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/EduExpose.xcarchive/Products/Applications/EduExpose.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry EduExpose-unsigned.ipa Payload
          shasum -a 256 EduExpose-unsigned.ipa > EduExpose-unsigned.ipa.sha256
          cp EduExpose-unsigned.ipa EduExpose-unsigned.ipa.sha256 "$GITHUB_WORKSPACE/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EduExpose-unsigned-ipa
          path: |
            EduExpose-unsigned.ipa
            EduExpose-unsigned.ipa.sha256

      - name: Publish rolling prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/swift'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: EduExpose (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body: |
            Automatyczny build gałęzi `swift` z commita ${{ github.sha }}.
            IPA jest niepodpisane — podpisz je Sideloadly przed instalacją.
            Instrukcja: docs/sideloading.md
          files: |
            EduExpose-unsigned.ipa
            EduExpose-unsigned.ipa.sha256
