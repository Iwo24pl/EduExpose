name: Retry macOS workflows

# GitHub occasionally leaves the macOS 15/26 jobs queued until they are
# cancelled without ever starting: either no runner is assigned at all, or one
# is assigned and never comes online. Re-running those runs is the only lever
# available, so do it automatically instead of waiting for the next push.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-macos-workflows
  cancel-in-progress: false

jobs:
  retry:
    name: Re-run starved macOS workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      MAX_ATTEMPTS: "12"
      MAX_AGE_MINUTES: "720"
    steps:
      - name: Re-run the latest starved run of each workflow
        shell: bash
        run: |
          set -euo pipefail

          now=$(date -u +%s)
          runs=$(gh api "repos/$REPO/actions/runs?per_page=50")

          # A starved job either never gets a runner, or gets one that never
          # comes online. In both cases no step ever concludes.
          handle() {
            local workflow="$1" branch="${2:-}"
            echo "== $workflow ${branch:-(any branch)} =="

            if jq -e --arg w "$workflow" --arg b "$branch" '
              [.workflow_runs[]
               | select(.name == $w)
               | select($b == "" or .head_branch == $b)
               | select(.status != "completed")] | length > 0' <<<"$runs" >/dev/null; then
              echo "A run is still queued or running; leaving it alone."
              return 0
            fi

            local latest
            latest=$(jq -r --arg w "$workflow" --arg b "$branch" '
              [.workflow_runs[]
               | select(.name == $w)
               | select($b == "" or .head_branch == $b)
               | select(.status == "completed")][0] // empty | @json' <<<"$runs")
            if [ -z "$latest" ]; then
              echo "No completed run found."
              return 0
            fi

            local id conclusion attempt created age_minutes
            id=$(jq -r .id <<<"$latest")
            conclusion=$(jq -r .conclusion <<<"$latest")
            attempt=$(jq -r .run_attempt <<<"$latest")
            created=$(jq -r .created_at <<<"$latest")

            if [ "$conclusion" != "failure" ] && [ "$conclusion" != "cancelled" ]; then
              echo "Run $id concluded '$conclusion'; nothing to retry."
              return 0
            fi

            age_minutes=$(( (now - $(date -u -d "$created" +%s)) / 60 ))
            if [ "$age_minutes" -gt "$MAX_AGE_MINUTES" ]; then
              echo "Run $id is $age_minutes minutes old; leaving it."
              return 0
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "Run $id already reached attempt $attempt; leaving it for the next trigger."
              return 0
            fi

            local jobs mac_jobs mac_total mac_never_started
            jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100")
            mac_jobs=$(jq '[.jobs[] | select((.labels | join(",")) | test("macos"))]' <<<"$jobs")
            mac_total=$(jq 'length' <<<"$mac_jobs")
            mac_never_started=$(jq '[.[] | select(([.steps[]? | select(.conclusion != null and .conclusion != "")] | length) == 0)] | length' <<<"$mac_jobs")

            if [ "$mac_total" -eq 0 ] || [ "$mac_never_started" -ne "$mac_total" ]; then
              echo "Run $id failed after the macOS job actually started; not a provisioning failure."
              return 0
            fi

            echo "Re-running $id (attempt $attempt, $mac_never_started/$mac_total macOS jobs never started)."
            gh api -X POST "repos/$REPO/actions/runs/$id/rerun"
          }

          handle "iOS CI" "swift"
          handle "Release IPA"