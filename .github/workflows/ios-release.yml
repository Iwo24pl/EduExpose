name: Release IPA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag wydania, np. v1.0.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Build and publish IPA
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      SCHEME: EduExpose
      PROJECT: EduExpose.xcodeproj
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve tag
        id: release
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EduExpose.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        env:
          TAG: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/EduExpose.xcarchive/Products/Applications/EduExpose.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "EduExpose-$TAG-unsigned.ipa" Payload
          shasum -a 256 "EduExpose-$TAG-unsigned.ipa" > "EduExpose-$TAG-unsigned.ipa.sha256"
          cp "EduExpose-$TAG-unsigned.ipa" "EduExpose-$TAG-unsigned.ipa.sha256" "$GITHUB_WORKSPACE/"
          ditto -c -k --keepParent "$RUNNER_TEMP/EduExpose.xcarchive/dSYMs" "$GITHUB_WORKSPACE/EduExpose-$TAG-dSYMs.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.name }}
          name: EduExpose ${{ steps.release.outputs.name }}
          prerelease: false
          body: |
            Wydanie EduExpose ${{ steps.release.outputs.name }}.

            IPA jest niepodpisane. Instrukcja podpisania: docs/sideloading.md
          files: |
            EduExpose-${{ steps.release.outputs.name }}-unsigned.ipa
            EduExpose-${{ steps.release.outputs.name }}-unsigned.ipa.sha256
            EduExpose-${{ steps.release.outputs.name }}-dSYMs.zip
