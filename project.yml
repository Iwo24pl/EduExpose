name: EduExpose

options:
  bundleIdPrefix: com.iwo24pl
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: pl
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  EduExpose:
    type: application
    platform: iOS
    sources:
      - path: EduExpose
    settings:
      base:
        PRODUCT_NAME: EduExpose
        PRODUCT_BUNDLE_IDENTIFIER: com.iwo24pl.eduexpose
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EduExpose
        INFOPLIST_KEY_CFBundleDevelopmentRegion: pl
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - EduExposeTests
      gatherCoverageData: true

  EduExposeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EduExposeTests
    dependencies:
      - target: EduExpose
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iwo24pl.eduexpose.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EduExpose.app/EduExpose"
        BUNDLE_LOADER: "$(TEST_HOST)"
